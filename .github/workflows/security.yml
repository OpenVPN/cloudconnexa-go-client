name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...

      - name: Run govulncheck
        run: |
          # Pinned rather than @latest: govulncheck v1.8.0 requires Go >= 1.26, which
          # breaks the install against the Go version this workflow pins. v1.7.0 is the
          # newest release that builds under Go 1.25. Bump both together.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
