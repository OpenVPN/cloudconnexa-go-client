name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...

      - name: Run govulncheck
        run: |
          # Pinned rather than @latest: newer govulncheck releases may require a Go
          # newer than the version this workflow pins. v1.9.0 builds under Go 1.26.
          # Bump both together.
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
